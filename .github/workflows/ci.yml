name: Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
          - release
        required: true
        default: 'test'
      tag_name:
        description: 'Required for "release" task: The tag for the action (e.g., v0.1.3)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: vuio-media-info
  GUI_BINARY_NAME: vuio-media-info-gui
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rustfmt
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  web_ui:
    name: Web UI bundle is intact
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/mediainfo-gui/package-lock.json
      - name: Build Web UI
        working-directory: crates/mediainfo-gui
        run: |
          npm ci || npm install
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }

  clippy:
    name: Clippy
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            clippy-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run Clippy
        env:
          RUSTC_WRAPPER: sccache
        run: cargo clippy -p vuio-media-info --all-targets --all-features -- -D clippy::all -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  feature_matrix:
    name: Feature & Crates Check
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: features-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            features-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            features-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Check package and documentation
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo check -p vuio-media-info --all-targets --all-features
          cargo test -p vuio-media-info --doc
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  corpus:
    name: Parser output matches ffprobe
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: corpus-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            corpus-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            corpus-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install ffmpeg and mediainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo
      - name: Build the CLI
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --bin vuio-media-info
      - name: Generate the sample corpus
        run: ./tools/make_corpus.sh
      - name: Compare against ffprobe
        run: python3 tools/compare_ffprobe.py
      - name: Report differences from MediaInfo (advisory)
        continue-on-error: true
        run: python3 tools/compare_mediainfo.py
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  msrv:
    name: Minimum supported Rust version
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Read rust-version from the manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2 || echo "1.80.0")
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Cargo registry, git dependencies and compiler artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            msrv-${{ steps.msrv.outputs.version }}-${{ runner.os }}-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Check CLI and library with declared MSRV
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check -p vuio-media-info
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  # ===================================================================
  # Run Tests and Checks (Push, Pull Requests, or Manual 'test' run)
  # ===================================================================
  test_and_check:
    name: Test on ${{ matrix.target }}
    if: |
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          # Windows (CLI + GUI)
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            build_gui: true
            mode: native-test
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            build_gui: true
            mode: build-only

          # macOS (CLI + GUI)
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            build_gui: true
            mode: native-test
          - runner: macos-14
            target: aarch64-apple-darwin
            build_gui: true
            mode: native-test

          # Linux (CLI only)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_gui: false
            mode: native-test
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build_gui: false
            mode: cross-linux
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build_gui: false
            mode: cross-linux

          # FreeBSD (CLI only)
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            build_gui: false
            mode: freebsd-vm

    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (GUI platforms)
        if: matrix.build_gui == true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/mediainfo-gui/package-lock.json

      - name: Build GUI frontend assets (GUI platforms)
        if: matrix.build_gui == true
        working-directory: crates/mediainfo-gui
        run: |
          npm ci || npm install
          npm run build

      - name: Install Rust toolchain (stable)
        if: matrix.mode != 'freebsd-vm'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry, git dependencies and compiler artifacts
        if: matrix.mode != 'freebsd-vm'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: test-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            test-${{ runner.os }}-${{ matrix.target }}-
            test-${{ runner.os }}-

      - name: Install sccache
        if: matrix.mode != 'freebsd-vm'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies for ARM cross-compile (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          fi

      - name: Configure cross-linker (Linux ARM)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          fi

      # ── Native Tests ──
      - name: "Run native tests (Workspace: CLI + GUI)"
        if: matrix.mode == 'native-test' && matrix.build_gui == true
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: "Run native tests (CLI only)"
        if: matrix.mode == 'native-test' && matrix.build_gui == false
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --workspace --exclude vuio-media-info-gui --target ${{ matrix.target }}

      # ── Non-native targets: fast PR check vs full build ──
      - name: "Fast PR compile check for non-native GUI target"
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && matrix.build_gui == true && github.event_name == 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check --workspace --target ${{ matrix.target }}

      - name: "Fast PR compile check for non-native CLI target"
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && matrix.build_gui == false && github.event_name == 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check -p vuio-media-info --target ${{ matrix.target }}

      - name: "Full build for non-native GUI target"
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && matrix.build_gui == true && github.event_name != 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: "Full build for non-native CLI target"
        if: matrix.mode != 'native-test' && matrix.mode != 'freebsd-vm' && matrix.build_gui == false && github.event_name != 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build -p vuio-media-info --target ${{ matrix.target }}

      # ── FreeBSD VM ──
      - name: "Build and test in FreeBSD VM (CLI only)"
        if: matrix.mode == 'freebsd-vm'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: false
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo build -p vuio-media-info
            cargo test --workspace --exclude vuio-media-info-gui

      - name: Show sccache stats
        if: always() && matrix.mode != 'freebsd-vm'
        run: sccache --show-stats || true

  # ===================================================================
  # Job: Build Release Artifacts
  # ===================================================================
  build_release_artifacts:
    name: Build release for ${{ matrix.target }}
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (CLI + GUI)
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os-arch: windows-x86_64
            asset_ext: .zip
            build_gui: true
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os-arch: windows-arm64
            asset_ext: .zip
            build_gui: true

          # macOS (CLI + GUI)
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os-arch: macos-x86_64
            asset_ext: .tar.gz
            build_gui: true
          - runner: macos-14
            target: aarch64-apple-darwin
            os-arch: macos-arm64
            asset_ext: .tar.gz
            build_gui: true

          # Linux (CLI only)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-arch: linux-x86_64
            asset_ext: .tar.gz
            build_gui: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os-arch: linux-arm64
            asset_ext: .tar.gz
            build_gui: false
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            os-arch: linux-armv7
            asset_ext: .tar.gz
            build_gui: false

          # FreeBSD (CLI only)
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            os-arch: freebsd-x86_64
            asset_ext: .tar.gz
            build_gui: false

    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 8G

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (GUI platforms)
        if: matrix.build_gui == true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/mediainfo-gui/package-lock.json

      - name: Build GUI frontend assets (GUI platforms)
        if: matrix.build_gui == true
        working-directory: crates/mediainfo-gui
        run: |
          npm ci || npm install
          npm run build

      - name: Install Rust toolchain
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry, git dependencies and compiler artifacts
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sccache
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            release-${{ runner.os }}-${{ matrix.target }}-
            release-${{ runner.os }}-

      - name: Install sccache
        if: matrix.target != 'x86_64-unknown-freebsd'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies for ARM cross-compile (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          fi

      - name: Configure cross-linker (Linux ARM)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          mkdir -p ~/.cargo "$HOME/bin"
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            cat > "$HOME/bin/arm-linux-gnueabihf-gcc-wrap" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mno-omit-leaf-frame-pointer" ]]; then
              args+=("$arg")
            fi
          done
          exec arm-linux-gnueabihf-gcc "${args[@]}"
          EOF
            chmod +x "$HOME/bin/arm-linux-gnueabihf-gcc-wrap"
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo "linker = \"$HOME/bin/arm-linux-gnueabihf-gcc-wrap\"" >> ~/.cargo/config.toml
            echo "CC_armv7_unknown_linux_gnueabihf=$HOME/bin/arm-linux-gnueabihf-gcc-wrap" >> "$GITHUB_ENV"
          fi

      - name: "Build binary (Workspace release: CLI + GUI)"
        if: matrix.build_gui == true
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: "Build binary (CLI only release)"
        if: matrix.build_gui == false && matrix.target != 'x86_64-unknown-freebsd'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p vuio-media-info --target ${{ matrix.target }}

      - name: "Build binary in FreeBSD VM (CLI only)"
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          sync: rsync
          copyback: true
          mem: "6144"
          cache-after-prepare: true
          prepare: |
            pkg install -y curl bash git cmake
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc -vV
            cargo build --release -p vuio-media-info

      - name: Package artifacts
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the 'release' task."
              exit 1
            fi
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          VERSION=${VERSION_TAG#v}
          echo "Packaging artifacts for version: $VERSION_TAG"

          if [ "${{ matrix.target }}" == "x86_64-unknown-freebsd" ]; then
            RELEASE_DIR="target/release"
          else
            RELEASE_DIR="target/${{ matrix.target }}/release"
          fi

          # 1. Package CLI archive
          STAGING_CLI="stage-cli-${{ matrix.os-arch }}"
          mkdir -p "$STAGING_CLI"

          if [ -f "$RELEASE_DIR/${{ env.BINARY_NAME }}.exe" ]; then
            cp "$RELEASE_DIR/${{ env.BINARY_NAME }}.exe" "$STAGING_CLI/"
          elif [ -f "$RELEASE_DIR/${{ env.BINARY_NAME }}" ]; then
            cp "$RELEASE_DIR/${{ env.BINARY_NAME }}" "$STAGING_CLI/"
          fi
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "$STAGING_CLI/" 2>/dev/null || true

          CLI_ASSET_NAME="${{ env.BINARY_NAME }}-${{ matrix.os-arch }}${{ matrix.asset_ext }}"
          if [ "${{ matrix.asset_ext }}" == ".zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              (cd "$STAGING_CLI" && 7z a -r "../$CLI_ASSET_NAME" .)
            elif command -v zip >/dev/null 2>&1; then
              (cd "$STAGING_CLI" && zip -r "../$CLI_ASSET_NAME" .)
            else
              powershell -Command "Compress-Archive -Path '$STAGING_CLI/*' -DestinationPath '$CLI_ASSET_NAME' -Force"
            fi
          else
            tar -czf "$CLI_ASSET_NAME" -C "$STAGING_CLI" .
          fi

          # 2. Package GUI archive (Windows & macOS only)
          if [ "${{ matrix.build_gui }}" == "true" ]; then
            STAGING_GUI="stage-gui-${{ matrix.os-arch }}"
            mkdir -p "$STAGING_GUI"

            if [[ "${{ matrix.runner }}" == macos* ]]; then
              APP_DIR="$STAGING_GUI/VuioMediaInfo.app"
              mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
              cp "$RELEASE_DIR/${{ env.GUI_BINARY_NAME }}" "$APP_DIR/Contents/MacOS/VuioMediaInfo"
              chmod +x "$APP_DIR/Contents/MacOS/VuioMediaInfo"
              cp crates/mediainfo-gui/icons/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
              echo -n "APPL????" > "$APP_DIR/Contents/PkgInfo"
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0">' \
                '<dict>' \
                '    <key>CFBundleExecutable</key><string>VuioMediaInfo</string>' \
                '    <key>CFBundleIconFile</key><string>icon.icns</string>' \
                '    <key>CFBundleIdentifier</key><string>com.mediainfo.desktop</string>' \
                '    <key>CFBundleName</key><string>VuioMediaInfo</string>' \
                '    <key>CFBundleDisplayName</key><string>VuIO Media Info</string>' \
                '    <key>CFBundlePackageType</key><string>APPL</string>' \
                "    <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
                "    <key>CFBundleVersion</key><string>${VERSION}</string>" \
                '    <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>' \
                '    <key>LSMinimumSystemVersion</key><string>10.13</string>' \
                '    <key>NSHighResolutionCapable</key><true/>' \
                '    <key>NSPrincipalClass</key><string>NSApplication</string>' \
                '    <key>NSSupportsAutomaticGraphicsSwitching</key><true/>' \
                '    <key>NSRequiresAquaSystemAppearance</key><false/>' \
                '</dict>' \
                '</plist>' > "$APP_DIR/Contents/Info.plist"
              codesign --force --deep --sign - "$APP_DIR"
            elif [ -f "$RELEASE_DIR/${{ env.GUI_BINARY_NAME }}.exe" ]; then
              cp "$RELEASE_DIR/${{ env.GUI_BINARY_NAME }}.exe" "$STAGING_GUI/"
            elif [ -f "$RELEASE_DIR/${{ env.GUI_BINARY_NAME }}" ]; then
              cp "$RELEASE_DIR/${{ env.GUI_BINARY_NAME }}" "$STAGING_GUI/"
            fi
            cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "$STAGING_GUI/" 2>/dev/null || true

            GUI_ASSET_NAME="${{ env.GUI_BINARY_NAME }}-${{ matrix.os-arch }}${{ matrix.asset_ext }}"
            if [ "${{ matrix.asset_ext }}" == ".zip" ]; then
              if command -v 7z >/dev/null 2>&1; then
                (cd "$STAGING_GUI" && 7z a -r "../$GUI_ASSET_NAME" .)
              elif command -v zip >/dev/null 2>&1; then
                (cd "$STAGING_GUI" && zip -r "../$GUI_ASSET_NAME" .)
              else
                powershell -Command "Compress-Archive -Path '$STAGING_GUI/*' -DestinationPath '$GUI_ASSET_NAME' -Force"
              fi
            else
              tar -czf "$GUI_ASSET_NAME" -C "$STAGING_GUI" .
            fi
          fi

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.os-arch }}
          path: |
            ${{ env.BINARY_NAME }}-*
            ${{ env.GUI_BINARY_NAME }}-*

      - name: Show sccache stats
        if: always() && matrix.target != 'x86_64-unknown-freebsd'
        run: sccache --show-stats || true

  # ===================================================================
  # Job: Create GitHub Release
  # ===================================================================
  create_github_release:
    name: Create GitHub Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    needs: build_release_artifacts
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          draft: true
          files: release-artifacts/*/*

  # ===================================================================
  # Job: Update Homebrew Formula (Optional Tap sync)
  # ===================================================================
  update_homebrew_formula:
    name: Update Homebrew Formula
    needs: [build_release_artifacts, create_github_release]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew Token Availability
        id: check_token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_VUIO_PUSH_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "No HOMEBREW_VUIO_PUSH_TOKEN or HOMEBREW_TAP_TOKEN secret configured; skipping Homebrew tap sync."
          fi

      - name: Get tag name
        if: steps.check_token.outputs.has_token == 'true'
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all release artifacts
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Checkout Homebrew Tap Repo
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: vuiodev/homebrew-vuio
          token: ${{ secrets.HOMEBREW_VUIO_PUSH_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-vuio

      - name: Calculate Checksums and Update Formula
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          TAG_NAME="${{ steps.get_tag.outputs.TAG }}"
          VERSION=${TAG_NAME#v}
          
          echo "Calculating checksums for release $TAG_NAME..."
          
          get_sha256() {
            local asset_name=$1
            local file_path
            file_path=$(find release-artifacts -name "$asset_name" -type f | head -n 1)
            if [ -z "$file_path" ] || [ ! -f "$file_path" ]; then
              echo "Error: Release asset $asset_name not found in downloaded artifacts!" >&2
              exit 1
            fi
            sha256sum "$file_path" | cut -d' ' -f1
          }
          
          MAC_ARM_SHA=$(get_sha256 "vuio-media-info-macos-arm64.tar.gz")
          MAC_INTEL_SHA=$(get_sha256 "vuio-media-info-macos-x86_64.tar.gz")
          LINUX_ARM64_SHA=$(get_sha256 "vuio-media-info-linux-arm64.tar.gz")
          LINUX_ARMV7_SHA=$(get_sha256 "vuio-media-info-linux-armv7.tar.gz")
          LINUX_INTEL_SHA=$(get_sha256 "vuio-media-info-linux-x86_64.tar.gz")

          GUI_MAC_ARM_SHA=$(get_sha256 "vuio-media-info-gui-macos-arm64.tar.gz")
          GUI_MAC_INTEL_SHA=$(get_sha256 "vuio-media-info-gui-macos-x86_64.tar.gz")
          
          # 1. Generate CLI Formula
          echo "Generating homebrew-vuio/Formula/vuio-media-info.rb..."
          mkdir -p homebrew-vuio/Formula
          printf '%s\n' \
            'class VuioMediaInfo < Formula' \
            '  desc "Exhaustive media metadata inspection and reporting engine in pure Rust"' \
            '  homepage "https://github.com/vuiodev/vuio-media-info"' \
            "  version \"${VERSION}\"" \
            '' \
            '  if OS.mac?' \
            '    if Hardware::CPU.arm?' \
            "      url \"https://github.com/vuiodev/vuio-media-info/releases/download/${TAG_NAME}/vuio-media-info-macos-arm64.tar.gz\"" \
            "      sha256 \"${MAC_ARM_SHA}\"" \
            '    else' \
            "      url \"https://github.com/vuiodev/vuio-media-info/releases/download/${TAG_NAME}/vuio-media-info-macos-x86_64.tar.gz\"" \
            "      sha256 \"${MAC_INTEL_SHA}\"" \
            '    end' \
            '  elsif OS.linux?' \
            '    if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?' \
            "      url \"https://github.com/vuiodev/vuio-media-info/releases/download/${TAG_NAME}/vuio-media-info-linux-arm64.tar.gz\"" \
            "      sha256 \"${LINUX_ARM64_SHA}\"" \
            '    elsif Hardware::CPU.arm?' \
            "      url \"https://github.com/vuiodev/vuio-media-info/releases/download/${TAG_NAME}/vuio-media-info-linux-armv7.tar.gz\"" \
            "      sha256 \"${LINUX_ARMV7_SHA}\"" \
            '    else' \
            "      url \"https://github.com/vuiodev/vuio-media-info/releases/download/${TAG_NAME}/vuio-media-info-linux-x86_64.tar.gz\"" \
            "      sha256 \"${LINUX_INTEL_SHA}\"" \
            '    end' \
            '  end' \
            '' \
            '  def install' \
            '    bin.install "vuio-media-info"' \
            '  end' \
            '' \
            '  test do' \
            '    system "#{bin}/vuio-media-info", "--version"' \
            '  end' \
            'end' > homebrew-vuio/Formula/vuio-media-info.rb

          # 2. Generate GUI Cask (macOS)
          echo "Generating homebrew-vuio/Casks/vuio-media-info.rb..."
          mkdir -p homebrew-vuio/Casks
          printf '%s\n' \
            'cask "vuio-media-info" do' \
            '  arch arm: "arm64", intel: "x86_64"' \
            '' \
            "  version \"${VERSION}\"" \
            "  sha256 arm:   \"${GUI_MAC_ARM_SHA}\"," \
            "         intel: \"${GUI_MAC_INTEL_SHA}\"" \
            '' \
            '  url "https://github.com/vuiodev/vuio-media-info/releases/download/v#{version}/vuio-media-info-gui-macos-#{arch}.tar.gz"' \
            '  name "VuIO Media Info"' \
            '  desc "Ultra-lightweight native cross-platform GUI for mediainfo"' \
            '  homepage "https://github.com/vuiodev/vuio-media-info"' \
            '' \
            '  app "VuioMediaInfo.app"' \
            '  binary "#{appdir}/VuioMediaInfo.app/Contents/MacOS/VuioMediaInfo", target: "vuio-media-info-gui"' \
            '' \
            '  zap trash: [' \
            '    "~/Library/Application Support/com.vuiomediainfo.desktop",' \
            '    "~/Library/Saved Application State/com.vuiomediainfo.desktop.savedState",' \
            '  ]' \
            'end' > homebrew-vuio/Casks/vuio-media-info.rb
          
          cd homebrew-vuio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update vuio-media-info formula & cask to version ${VERSION}" || echo "No changes to commit"
          git push origin main || echo "Push failed or not permitted"
