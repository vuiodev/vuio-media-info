[workspace]
members = [
    "crates/mediainfo-gui",
    ".",
]
default-members = [
    ".",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
authors = ["vyrti"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vuiodev/vuio-media-info"
readme = "README.md"

[workspace.dependencies]
vuio-media-info = { path = ".", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
jwalk = "0.9"

# Tauri v2 Ecosystem (GUI)
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
window-vibrancy = "0.5"

[package]
name = "vuio-media-info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust rewrite of MediaInfoLib: exhaustive media metadata inspection and reporting engine"
repository.workspace = true
readme.workspace = true
keywords = ["mediainfo", "video", "audio", "metadata", "multimedia"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
quick-xml = { version = "0.42", features = ["serialize"] }
byteorder = "1.5"
bitflags = "2.13"
memmap2 = "0.9"
clap = { version = "4.6", features = ["derive"] }
rayon.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
colored = "3.1"
thiserror = "2.0"
memchr = "2.8"
jwalk.workspace = true

[lib]
name = "vuio_media_info"
path = "src/lib.rs"

[[bin]]
name = "vuio-media-info"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
